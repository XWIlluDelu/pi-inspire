name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Checks, one platform, Safari, release, or full browser coverage"
        type: choice
        default: checks
        options:
          - checks
          - windows-core
          - macos-core
          - windows
          - macos
          - safari
          - release
          - full

# Replace obsolete development/PR runs only within the same verification scope.
# Main and other refs use unique groups so their running and pending evidence survives.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.scope || 'full' }}-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev' }}

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'checks' || inputs.scope == 'release' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'checks' }}
        run: npx playwright install --with-deps chromium firefox
      - name: Quality checks
        run: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'checks' && 'npm run check' || 'npm run ci' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  platform:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'checks' }}
    name: ${{ matrix.os }} ${{ inputs.scope == 'safari' && 'WebKit' || endsWith(inputs.scope, '-core') && 'core' || 'core and Chromium' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(inputs.scope, 'windows') && '["windows-latest"]' || (startsWith(inputs.scope, 'macos') || inputs.scope == 'safari') && '["macos-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 50 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build browser app
        id: web
        run: npm run build:web
      - name: Portable filesystem and process checks
        if: ${{ !cancelled() && inputs.scope != 'safari' && steps.web.outcome == 'success' }}
        run: npm run test:portable
      - name: Node and native integration tests
        if: ${{ !cancelled() && inputs.scope != 'safari' && steps.web.outcome == 'success' }}
        # These suites start real Pi and Host children beside the Vitest worker.
        run: npm test -- --project=node --project=integration --exclude 'tests/{web,shared}/**' ${{ matrix.os == 'windows-latest' && '--maxWorkers=1' || '' }}
      - name: Native session Trash and recovery
        if: ${{ !cancelled() && inputs.scope != 'safari' && steps.web.outcome == 'success' }}
        env:
          INSPIRE_NATIVE_TRASH_TEST: "1"
        run: npx vitest run tests/server/native-session-trash-smoke.test.ts
      - name: Launcher lifecycle tests
        if: ${{ !cancelled() && inputs.scope != 'safari' && steps.web.outcome == 'success' }}
        run: npm run test:launcher
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && !endsWith(inputs.scope, '-core') && inputs.scope != 'safari' && steps.web.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Chromium behavior tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:browser:chromium -- --grep ${{ inputs.scope == 'full' && '.' || '@platform-ui' }}
      - name: Install native macOS WebKit
        id: webkit
        if: ${{ inputs.scope == 'safari' && steps.web.outcome == 'success' }}
        run: npx playwright install webkit
      - name: Safari-engine daily workflows
        if: ${{ steps.webkit.outcome == 'success' }}
        run: npm run test:browser -- --project=webkit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ runner.os }}-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  release-verify:
    # The release dispatch uses the same gates as a push to main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'release' || inputs.scope == 'full'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
        env:
          INSPIRE_SIZE_REPORT: ${{ runner.os == 'Linux' && 'output/size-report.json' || '' }}
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: output/size-report.json
          if-no-files-found: ignore
