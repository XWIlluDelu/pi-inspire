name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  platform:
    name: ${{ matrix.os }} core and Chromium
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Format, lint, types and unused-code checks run once in quality.
      # Keep OS-dependent build and behavior checks here, collecting every
      # runnable phase even after a test failure without ignoring that failure.
      - name: Build browser app
        id: web
        run: npm run build:web
      - name: Portable filesystem and process checks
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:portable
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm test
      - name: Launcher lifecycle tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:launcher
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Browser behavior tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:browser:chromium
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ runner.os }}-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  size-report:
    # Measurement remains visible when it breaks but must not mask the required
    # correctness gates above.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `size:report` builds before packing, so the inventory describes the
      # release artifact rather than a clean-checkout source-only tarball.
      - run: |
          node -e "require('node:fs').mkdirSync('output', { recursive: true })"
      - run: npm run size:report > output/size-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: output/size-report.json
          if-no-files-found: ignore

  release-verify:
    # The full packaged-host smoke is release evidence. Run it after main lands
    # across every supported Host OS rather than repeating it for every PR edit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
