name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_only:
        description: "Focused platform regressions and daily browser flows; default runs all checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Build, native/core checks and all three browser engines run serially.
    # Bound their aggregate without cancelling a still-progressing browser tail.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.native_only }}
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Quality checks
        run: ${{ inputs.native_only && 'npm run check' || 'npm run ci' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  platform:
    name: ${{ matrix.os }} core and Chromium
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Native/core and the full browser suite run serially. macOS Chromium alone
    # takes about 27 minutes, followed by native WebKit; leave room for that tail
    # without changing individual test or runtime deadlines.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 50 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Format, lint, types and unused-code checks run once in quality.
      # Keep OS-dependent build and behavior checks here, collecting every
      # runnable phase even after a test failure without ignoring that failure.
      - name: Build browser app
        id: web
        run: npm run build:web
      - name: Portable filesystem and process checks
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:portable
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: ${{ inputs.native_only && 'npm run test:platform' || 'npm test' }}
      - name: Native session Trash and recovery
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        env:
          INSPIRE_NATIVE_TRASH_TEST: "1"
        run: npx vitest run tests/server/native-session-trash-smoke.test.ts
      - name: Launcher lifecycle tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:launcher
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Browser behavior tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: ${{ inputs.native_only && 'npx playwright test --project=chromium --grep "@cross-browser|@platform-ui"' || 'npm run test:browser:chromium' }}
      - name: Install native macOS WebKit
        id: webkit
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && steps.web.outcome == 'success' }}
        run: npx playwright install webkit
      - name: Safari-engine daily workflows
        if: ${{ !cancelled() && steps.webkit.outcome == 'success' }}
        env:
          INSPIRE_BROWSER_TEST_OUTPUT_DIR: output/playwright/webkit-host
          PLAYWRIGHT_HTML_OUTPUT_DIR: output/playwright/webkit-report
        run: npx playwright test --project=webkit --output=output/playwright/webkit-results
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ runner.os }}-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  size-report:
    # Measurement remains visible when it breaks but must not mask the required
    # correctness gates above.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `size:report` builds before packing, so the inventory describes the
      # release artifact rather than a clean-checkout source-only tarball.
      - run: |
          node -e "require('node:fs').mkdirSync('output', { recursive: true })"
      - run: npm run size:report > output/size-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: output/size-report.json
          if-no-files-found: ignore

  release-verify:
    # Run after main lands and on explicit verification of another ref, without
    # repeating the full packaged-host smoke for every PR edit.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
