name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Checks, one platform (core skips browsers), or full acceptance"
        type: choice
        default: checks
        options:
          - checks
          - windows-core
          - macos-core
          - windows
          - macos
          - full

# Replace obsolete development/PR runs only within the same verification scope.
# Main and other refs use unique groups so their running and pending evidence survives.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.scope || 'full' }}-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev' }}

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'checks' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    # Build, native/core checks and all three browser engines run serially.
    # Bound their aggregate without cancelling a still-progressing browser tail.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' }}
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Quality checks
        run: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'checks' && 'npm run check' || 'npm run ci' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  platform:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'checks' }}
    name: ${{ matrix.os }} ${{ endsWith(inputs.scope, '-core') && 'core' || 'core and Chromium' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(inputs.scope, 'windows') && '["windows-latest"]' || startsWith(inputs.scope, 'macos') && '["macos-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Native/core and the full browser suite run serially. macOS Chromium alone
    # takes about 27 minutes, followed by native WebKit; leave room for that tail
    # without changing individual test or runtime deadlines.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 50 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stable acceptance runs format, lint, types and unused-code checks in quality.
      # A targeted platform dispatch relies on the preceding local/checks validation.
      # Keep OS-dependent build and behavior checks here, collecting every
      # runnable phase even after a test failure without ignoring that failure.
      - name: Build browser app
        id: web
        run: npm run build:web
      - name: Portable filesystem and process checks
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:portable
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm test
      - name: Native session Trash and recovery
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        env:
          INSPIRE_NATIVE_TRASH_TEST: "1"
        run: npx vitest run tests/server/native-session-trash-smoke.test.ts
      - name: Launcher lifecycle tests
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: npm run test:launcher
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && !endsWith(inputs.scope, '-core') && steps.web.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Browser behavior tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:browser:chromium
      - name: Install native macOS WebKit
        id: webkit
        if: ${{ !cancelled() && !endsWith(inputs.scope, '-core') && matrix.os == 'macos-latest' && steps.web.outcome == 'success' }}
        run: npx playwright install webkit
      - name: Safari-engine daily workflows
        if: ${{ !cancelled() && steps.webkit.outcome == 'success' }}
        env:
          INSPIRE_BROWSER_TEST_OUTPUT_DIR: output/playwright/webkit-host
          PLAYWRIGHT_HTML_OUTPUT_DIR: output/playwright/webkit-report
        run: npx playwright test --project=webkit --output=output/playwright/webkit-results
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ runner.os }}-artifacts
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore

  size-report:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' }}
    # Measurement remains visible when it breaks but must not mask the required
    # correctness gates above.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `size:report` builds before packing, so the inventory describes the
      # release artifact rather than a clean-checkout source-only tarball.
      - run: |
          node -e "require('node:fs').mkdirSync('output', { recursive: true })"
      - run: npm run size:report > output/size-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: output/size-report.json
          if-no-files-found: ignore

  release-verify:
    # Run after main lands and on explicit full acceptance of another ref, without
    # repeating the full packaged-host smoke for every PR edit.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
