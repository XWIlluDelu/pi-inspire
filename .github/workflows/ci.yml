name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/auto-dev' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - name: Verify installed package
        if: github.event_name == 'push'
        run: npm run release:verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: output/playwright/results/
          if-no-files-found: ignore
