name: Native command verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-command-review.yml
      - .github/native-command-review-part-*.txt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed patches and remove temporary verification files
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          files = sorted(pathlib.Path('.github').glob('native-command-review-part-*.txt'))
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in files), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5b279d481bf0fee1393d4d53dd65b16ad4b69614117edea8fb9365387eb9aacb'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          followup = ''
          patch = gzip.decompress(base64.b64decode(followup, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6c84680fc75578c53e957b09a8dc95c628473a1cd8891fd5fd8bba44bac5e3c9'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/workflows/native-command-review.yml', *map(str, files)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - run: npm ci
      - name: Format the follow-up and record the final tree before verification
        run: |
          npx biome format --write src/components/transcript-rows.tsx src/styles/transcript.css tests/browser/native-commands.spec.ts tests/web/transcript-fold.test.tsx
          git add src/components/transcript-rows.tsx src/styles/transcript.css tests/browser/native-commands.spec.ts tests/web/transcript-fold.test.tsx
          git diff --cached --check
          git diff --cached --stat
          python3 - <<'PY'
          import os, pathlib, subprocess, tarfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'native-command-final.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          (temp / 'native-command-tested-tree.txt').write_bytes(subprocess.check_output(['git', 'write-tree']))
          with tarfile.open(temp / 'native-command-source.tar.gz', 'w:gz') as archive:
              for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
                  if not raw:
                      continue
                  source = pathlib.Path(os.fsdecode(raw))
                  if source.suffix in {'.ts', '.tsx', '.mjs', '.json', '.jsonl', '.md', '.css', '.yml', '.yaml'}:
                      archive.add(source, arcname=str(source))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: native-command-source
          retention-days: 3
          path: |
            ${{ runner.temp }}/native-command-final.patch
            ${{ runner.temp }}/native-command-source.tar.gz
            ${{ runner.temp }}/native-command-tested-tree.txt
      - run: npx playwright install --with-deps chromium
      - name: Verify the complete final tree
        run: |
          status=0
          npm run ci > "$RUNNER_TEMP/native-command-validation.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/native-command-validation.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/native-command-tested-tree.txt")"
      - name: Prepare verified commit without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def api(endpoint, body):
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{endpoint}"
              request = urllib.request.Request(url, data=json.dumps(body).encode(), headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              }, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          parent = git('rev-parse', 'HEAD')
          assert parent == os.environ['GITHUB_SHA']
          changes = []
          for line in git('diff', '--cached', '--name-status', '--no-renames').splitlines():
              status, path = line.split('\t', 1)
              if status == 'D':
                  changes.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  mode = git('ls-files', '-s', '--', path).split()[0]
                  blob = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode()})
                  changes.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          tree = api('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': changes})
          assert tree['sha'] == git('write-tree'), 'Published tree differs from the tested index'
          assert tree['sha'] == pathlib.Path(os.environ['RUNNER_TEMP'], 'native-command-tested-tree.txt').read_text().strip()
          commit = api('git/commits', {
              'message': 'fix(pi): align native commands and compaction presentation\n\nRestore chronological compaction checkpoints without changing model context.\nReserve native command names, revalidate resources after reload, and expose\nterminal-only capabilities. Restore summary retry detail from snapshots,\nreport manual outcomes for observers, and retire stale compact receipts.\n\nKeep checkpoint controls visible in narrow containers, separate clipboard\nactions from native disclosures, and maintain readable contrast on focus.\nCover keyboard copying, both themes, reload, and 320px through desktop.\nAdd server, client, and installed-Pi regressions; update compatibility docs.\nRemove temporary verification tooling.\n\nVerified with npm run ci on the complete final tree.',
              'tree': tree['sha'], 'parents': [parent],
          })
          result = {'parent': parent, 'sha': commit['sha'], 'tree': tree['sha'], 'url': commit['html_url']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'native-command-candidate.json').write_text(json.dumps(result, indent=2))
          print('VERIFIED_NATIVE_COMMAND_COMMIT=' + commit['sha'])
          print(json.dumps(result))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-command-verification
          retention-days: 3
          path: |
            ${{ runner.temp }}/native-command-validation.log
            ${{ runner.temp }}/native-command-candidate.json
            output/playwright/
          if-no-files-found: ignore
